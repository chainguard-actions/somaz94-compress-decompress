name: Create release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # v1.0.1, v1.0.2 등만 매칭

permissions:
  contents: write  # releases와 태그를 생성하기 위한 권한
  pull-requests: write  # changelog 생성을 위한 권한

jobs:
  build:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: "Check-out"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create GitHub release"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE.md
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Update major version tag"
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          git checkout main
          git fetch --tags
          MAJOR_VERSION="${CURRENT_TAG%%.*}"
          COMMIT_SHA=$(git rev-parse "$GIT_SHA")
          echo "Current commit SHA: $COMMIT_SHA"
          echo "Updating $MAJOR_VERSION to point to $CURRENT_TAG at commit $COMMIT_SHA"
          safe_major=$(printf '%s' "$MAJOR_VERSION" | tr -d '\n\r')
          safe_sha=$(printf '%s' "$COMMIT_SHA" | tr -d '\n\r')
          echo "MAJOR_VERSION=${safe_major}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${safe_sha}" >> "$GITHUB_ENV"

      # Delete old major version tag
      - name: Delete old major version tag
        uses: somaz94/go-git-commit-action@c483530753cc890617fbd29317939e94389cad2a # v1
        with:
          user_email: 'action@github.com'
          user_name: 'GitHub Action'
          tag_name: ${{ env.MAJOR_VERSION }}
          delete_tag: true
          github_token: ${{ secrets.PAT_TOKEN }}

      # Create new major version tag
      - name: Create new major version tag
        uses: somaz94/go-git-commit-action@c483530753cc890617fbd29317939e94389cad2a # v1
        with:
          user_email: 'action@github.com'
          user_name: 'GitHub Action'
          tag_name: ${{ env.MAJOR_VERSION }}
          tag_reference: ${{ env.COMMIT_SHA }}
          github_token: ${{ secrets.PAT_TOKEN }}
