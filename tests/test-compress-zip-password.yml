name: Test compress and decompress zip with password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pwd-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/pwd-source/secret.txt"
          mkdir -p "$GITHUB_WORKSPACE/pwd-output"
          mkdir -p "$GITHUB_WORKSPACE/pwd-extracted"

      - id: compress
        uses: .
        with:
          command: compress
          source: ./pwd-source
          dest: ./pwd-output
          destfilename: protected
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert compress with password succeeded
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/pwd-output/protected.zip" ]; then
            echo "FAIL: compressed file not found"
            echo "Contents of pwd-output:"
            ls -la "$GITHUB_WORKSPACE/pwd-output/" || true
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: password-protected compress succeeded"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ./pwd-output/protected.zip
          dest: ./pwd-extracted
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert decompress with password succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path output is empty"
            exit 1
          fi
          echo "PASS: password-protected decompress succeeded"

      - name: Assert extracted secret file exists
        run: |
          echo "Contents of pwd-extracted:"
          find "$GITHUB_WORKSPACE/pwd-extracted" -type f | sort
          if find "$GITHUB_WORKSPACE/pwd-extracted" -name "secret.txt" | grep -q .; then
            echo "PASS: secret.txt found in extracted output"
          else
            echo "FAIL: secret.txt not found in extracted output"
            exit 1
          fi
