name: Test compress zip with password protection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p pwd-source
          echo "Secret content" > pwd-source/secret.txt
          echo "More secrets" > pwd-source/classified.txt

      - id: compress
        uses: .
        with:
          command: compress
          source: ./pwd-source
          dest: ./pwd-dest
          destfilename: protected
          format: zip
          password: "TestPassword123!"
          verbose: "true"
          step_summary: "false"

      - name: Assert archive was created
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path=$FILE_PATH"

      - name: Assert archive file exists on host
        run: |
          ls -la pwd-dest/ || true
          if [ ! -f "pwd-dest/protected.zip" ]; then
            echo "FAIL: archive not found"
            exit 1
          fi
          echo "PASS: password-protected archive created"

      - name: Assert checksum output
        env:
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "checksum: $CHECKSUM"
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum=$CHECKSUM"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: ./pwd-extract
          format: zip
          password: "TestPassword123!"
          verbose: "true"
          step_summary: "false"

      - name: Assert decompression succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path output is empty"
            exit 1
          fi
          echo "PASS: decompression with password succeeded"

      - name: Assert extracted files content
        run: |
          echo "Contents of extract dir:"
          find pwd-extract -type f | sort
          if ! find pwd-extract -name "secret.txt" | grep -q .; then
            echo "FAIL: secret.txt not found in extracted output"
            exit 1
          fi
          CONTENT=$(find pwd-extract -name "secret.txt" -exec cat {} \;)
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "Secret content" ]; then
            echo "FAIL: file content mismatch, got: $CONTENT"
            exit 1
          fi
          echo "PASS: extracted file content verified"
