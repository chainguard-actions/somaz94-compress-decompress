name: Test compress tbz2 format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tbz2-source"
          echo "bzip2 test content" > "$GITHUB_WORKSPACE/tbz2-source/test.txt"
          echo "more content" > "$GITHUB_WORKSPACE/tbz2-source/more.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: ./tbz2-source
          dest: ./tbz2-output
          destfilename: archive
          format: tbz2
          verbose: "true"
          step_summary: "false"

      - name: Assert archive file exists
        run: |
          echo "Checking for archive at $GITHUB_WORKSPACE/tbz2-output/archive.tbz2"
          if [ ! -f "$GITHUB_WORKSPACE/tbz2-output/archive.tbz2" ]; then
            echo "FAIL: archive file does not exist"
            ls -la "$GITHUB_WORKSPACE/tbz2-output/" 2>/dev/null || echo "Output dir does not exist"
            exit 1
          fi
          echo "PASS: tbz2 archive created"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ./tbz2-output/archive.tbz2
          dest: ./tbz2-extracted
          format: tbz2
          verbose: "true"
          step_summary: "false"

      - name: Assert decompress succeeded
        env:
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count is empty"
            exit 1
          fi
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "FAIL: file_count should be at least 1, got $FILE_COUNT"
            exit 1
          fi
          echo "PASS: tbz2 decompress succeeded, file_count=$FILE_COUNT"

      - name: Assert extracted files exist
        run: |
          COUNT=$(find "$GITHUB_WORKSPACE/tbz2-extracted" -type f 2>/dev/null | wc -l)
          echo "Found $COUNT files in tbz2-extracted"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no files extracted"
            exit 1
          fi
          echo "PASS: files extracted successfully"
