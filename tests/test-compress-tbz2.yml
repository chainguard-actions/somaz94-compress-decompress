name: Test compress tbz2 format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tbz2-src"
          echo "bzip2 test file" > "$GITHUB_WORKSPACE/tbz2-src/data.txt"
          echo "another bzip2 file" > "$GITHUB_WORKSPACE/tbz2-src/info.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: tbz2-src
          dest: tbz2-output
          destfilename: archive
          format: tbz2
          includeRoot: "false"
          verbose: "true"

      - name: Log file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"

      - name: Assert tbz2 file exists
        run: |
          echo "Listing tbz2-output:"
          ls -la "$GITHUB_WORKSPACE/tbz2-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/tbz2-output/archive.tbz2" ]; then
            echo "FAIL: expected archive.tbz2 not found in tbz2-output"
            exit 1
          fi
          echo "PASS: archive.tbz2 exists"

      - name: Assert tbz2 file is valid and contains expected files
        run: |
          tar -tjf "$GITHUB_WORKSPACE/tbz2-output/archive.tbz2"
          if ! tar -tjf "$GITHUB_WORKSPACE/tbz2-output/archive.tbz2" | grep -q "data.txt"; then
            echo "FAIL: data.txt not found in archive"
            exit 1
          fi
          if ! tar -tjf "$GITHUB_WORKSPACE/tbz2-output/archive.tbz2" | grep -q "info.txt"; then
            echo "FAIL: info.txt not found in archive"
            exit 1
          fi
          echo "PASS: tbz2 archive contains expected files"
