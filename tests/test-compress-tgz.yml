name: Test compress tgz format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tgz-src"
          echo "Hello TGZ" > "$GITHUB_WORKSPACE/tgz-src/hello.txt"
          echo "Another file" > "$GITHUB_WORKSPACE/tgz-src/another.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: tgz-src
          dest: tgz-output
          destfilename: archive
          format: tgz

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert checksum output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "actual checksum: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum is set"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tgz-output/archive.tgz" ]; then
            echo "FAIL: expected archive file not found at tgz-output/archive.tgz"
            ls -la "$GITHUB_WORKSPACE/tgz-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid tgz
        run: |
          tar -tzf "$GITHUB_WORKSPACE/tgz-output/archive.tgz"
          echo "PASS: archive is a valid tgz file"
