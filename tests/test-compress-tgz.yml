name: Test compress tgz
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tgz-source/subdir"
          echo "Hello World" > "$GITHUB_WORKSPACE/test-tgz-source/hello.txt"
          echo "Another file" > "$GITHUB_WORKSPACE/test-tgz-source/another.txt"
          echo "Nested file" > "$GITHUB_WORKSPACE/test-tgz-source/subdir/nested.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: test-tgz-source
          dest: test-tgz-output
          destfilename: archive
          format: tgz

      - name: Assert file_path output is set
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $FILE_PATH"

      - name: Assert checksum output is set
        env:
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "checksum: $CHECKSUM"
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum is set"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-tgz-output/archive.tgz" ]; then
            echo "FAIL: expected archive file not found at $GITHUB_WORKSPACE/test-tgz-output/archive.tgz"
            ls -la "$GITHUB_WORKSPACE/test-tgz-output/" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid tgz
        run: |
          if ! tar -tzf "$GITHUB_WORKSPACE/test-tgz-output/archive.tgz" > /dev/null; then
            echo "FAIL: archive is not a valid tgz file"
            exit 1
          fi
          echo "PASS: archive is a valid tgz file"
          echo "Archive contents:"
          tar -tzf "$GITHUB_WORKSPACE/test-tgz-output/archive.tgz"
