name: Test compress tar format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tar-src"
          echo "tar test file 1" > "$GITHUB_WORKSPACE/tar-src/alpha.txt"
          echo "tar test file 2" > "$GITHUB_WORKSPACE/tar-src/beta.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: tar-src
          dest: tar-output
          destfilename: archive
          format: tar
          includeRoot: "false"
          verbose: "true"

      - name: Log file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"

      - name: Assert tar file exists
        run: |
          echo "Listing tar-output:"
          ls -la "$GITHUB_WORKSPACE/tar-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/tar-output/archive.tar" ]; then
            echo "FAIL: expected archive.tar not found in tar-output"
            exit 1
          fi
          echo "PASS: archive.tar exists"

      - name: Assert tar file is valid and contains expected files
        run: |
          tar -tf "$GITHUB_WORKSPACE/tar-output/archive.tar"
          if ! tar -tf "$GITHUB_WORKSPACE/tar-output/archive.tar" | grep -q "alpha.txt"; then
            echo "FAIL: alpha.txt not found in archive"
            exit 1
          fi
          if ! tar -tf "$GITHUB_WORKSPACE/tar-output/archive.tar" | grep -q "beta.txt"; then
            echo "FAIL: beta.txt not found in archive"
            exit 1
          fi
          echo "PASS: tar archive contains expected files"
