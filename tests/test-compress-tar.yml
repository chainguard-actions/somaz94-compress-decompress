name: Test compress tar
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tar-source"
          echo "File one content" > "$GITHUB_WORKSPACE/test-tar-source/file1.txt"
          echo "File two content" > "$GITHUB_WORKSPACE/test-tar-source/file2.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: test-tar-source
          dest: test-tar-output
          destfilename: archive
          format: tar

      - name: Assert file_path output is set
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $FILE_PATH"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-tar-output/archive.tar" ]; then
            echo "FAIL: expected archive file not found at $GITHUB_WORKSPACE/test-tar-output/archive.tar"
            ls -la "$GITHUB_WORKSPACE/test-tar-output/" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid tar
        run: |
          if ! tar -tf "$GITHUB_WORKSPACE/test-tar-output/archive.tar" > /dev/null; then
            echo "FAIL: archive is not a valid tar file"
            exit 1
          fi
          echo "PASS: archive is a valid tar file"
          echo "Archive contents:"
          tar -tf "$GITHUB_WORKSPACE/test-tar-output/archive.tar"

      - name: Decompress tar and verify content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-tar-verify"
          tar -xf "$GITHUB_WORKSPACE/test-tar-output/archive.tar" -C "$GITHUB_WORKSPACE/test-tar-verify"
          if ! find "$GITHUB_WORKSPACE/test-tar-verify" -name "file1.txt" | grep -q .; then
            echo "FAIL: expected file1.txt not found after decompression"
            find "$GITHUB_WORKSPACE/test-tar-verify" -type f
            exit 1
          fi
          echo "PASS: files extracted correctly from tar archive"
