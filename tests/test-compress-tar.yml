name: Test compress tar format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tar-src"
          echo "Hello TAR" > "$GITHUB_WORKSPACE/tar-src/hello.txt"
          echo "Data file" > "$GITHUB_WORKSPACE/tar-src/data.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: tar-src
          dest: tar-output
          destfilename: archive
          format: tar

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tar-output/archive.tar" ]; then
            echo "FAIL: expected archive file not found at tar-output/archive.tar"
            ls -la "$GITHUB_WORKSPACE/tar-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid tar
        run: |
          tar -tf "$GITHUB_WORKSPACE/tar-output/archive.tar"
          echo "PASS: archive is a valid tar file"
