name: Test password-protected zip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files
        run: |
          rm -rf secretdir secretdir.zip secret-out
          mkdir -p secretdir
          echo "top secret" > secretdir/secret.txt
      - id: compress
        uses: .
        with:
          command: compress
          source: ./secretdir
          format: zip
          password: "s3cr3t-pass"
      - name: Assert archive is encrypted
        run: |
          if [ ! -f secretdir.zip ]; then echo "FAIL: secretdir.zip not found"; exit 1; fi
          # Encrypted zip entries set bit 0 of the general purpose flag.
          python3 - <<'EOF'
          import zipfile, sys
          with zipfile.ZipFile("secretdir.zip") as z:
              infos = [i for i in z.infolist() if not i.is_dir()]
              print([(i.filename, i.flag_bits) for i in infos])
              if not infos or not all(i.flag_bits & 0x1 for i in infos):
                  print("FAIL: entries not encrypted"); sys.exit(1)
          print("PASS: encrypted")
          EOF
      - id: decompress
        uses: .
        with:
          command: decompress
          source: ./secretdir.zip
          format: zip
          dest: ./secret-out
          password: "s3cr3t-pass"
      - name: Assert decrypted content
        run: |
          find secret-out -type f
          ACTUAL=$(cat secret-out/secretdir/secret.txt)
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "top secret" ]; then echo "FAIL: wrong content"; exit 1; fi
          echo "PASS"
