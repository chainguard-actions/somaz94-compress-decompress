name: Test compress single file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a single source file
        run: |
          echo "Single file content for compression test" > single-file.txt

      - id: compress
        uses: .
        with:
          command: compress
          source: ./single-file.txt
          dest: ./single-dest
          destfilename: single
          format: zip
          verbose: "true"
          step_summary: "false"

      - name: Assert file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path=$FILE_PATH"

      - name: Assert archive file exists on host
        run: |
          ls -la single-dest/ || true
          if [ ! -f "single-dest/single.zip" ]; then
            echo "FAIL: archive not found"
            exit 1
          fi
          echo "PASS: single file archive created"

      - name: Assert file_count is 1
        env:
          FILE_COUNT: ${{ steps.compress.outputs.file_count }}
        run: |
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count output is empty"
            exit 1
          fi
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 file, got $FILE_COUNT"
            exit 1
          fi
          echo "PASS: file_count=$FILE_COUNT"

      - name: Assert original_size output
        env:
          ORIGINAL_SIZE: ${{ steps.compress.outputs.original_size }}
        run: |
          echo "original_size: $ORIGINAL_SIZE"
          if [ -z "$ORIGINAL_SIZE" ]; then
            echo "FAIL: original_size output is empty"
            exit 1
          fi
          echo "PASS: original_size=$ORIGINAL_SIZE"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: ./single-extract
          format: zip
          verbose: "true"
          step_summary: "false"

      - name: Assert extracted file content
        run: |
          echo "Contents of extract dir:"
          find single-extract -type f | sort
          if ! find single-extract -name "single-file.txt" | grep -q .; then
            echo "FAIL: single-file.txt not found in extracted output"
            exit 1
          fi
          CONTENT=$(find single-extract -name "single-file.txt" -exec cat {} \;)
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "Single file content for compression test" ]; then
            echo "FAIL: file content mismatch"
            exit 1
          fi
          echo "PASS: single file round-trip verified"
