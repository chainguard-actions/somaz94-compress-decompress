name: Test compress zip format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-src"
          echo "hello world" > "$GITHUB_WORKSPACE/test-src/file1.txt"
          echo "foo bar" > "$GITHUB_WORKSPACE/test-src/file2.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: test-src
          dest: test-output
          destfilename: archive
          format: zip
          includeRoot: "false"
          verbose: "true"

      - name: Log file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"

      - name: Assert compressed file exists
        run: |
          echo "Listing test-output:"
          ls -la "$GITHUB_WORKSPACE/test-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/test-output/archive.zip" ]; then
            echo "FAIL: expected archive.zip not found in test-output"
            exit 1
          fi
          echo "PASS: archive.zip exists"

      - name: Assert zip file is valid and contains expected files
        run: |
          unzip -l "$GITHUB_WORKSPACE/test-output/archive.zip"
          if ! unzip -l "$GITHUB_WORKSPACE/test-output/archive.zip" | grep -q "file1.txt"; then
            echo "FAIL: file1.txt not found in archive"
            exit 1
          fi
          if ! unzip -l "$GITHUB_WORKSPACE/test-output/archive.zip" | grep -q "file2.txt"; then
            echo "FAIL: file2.txt not found in archive"
            exit 1
          fi
          echo "PASS: zip archive contains expected files"
