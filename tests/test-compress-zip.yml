name: Test compress zip format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-src"
          echo "Hello World" > "$GITHUB_WORKSPACE/test-src/hello.txt"
          echo "Test file 2" > "$GITHUB_WORKSPACE/test-src/file2.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: test-src
          dest: test-output
          destfilename: archive
          format: zip

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert checksum output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "actual checksum: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum is set"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-output/archive.zip" ]; then
            echo "FAIL: expected archive file not found at test-output/archive.zip"
            ls -la "$GITHUB_WORKSPACE/test-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid zip
        run: |
          unzip -t "$GITHUB_WORKSPACE/test-output/archive.zip"
          echo "PASS: archive is a valid zip file"
