name: Test compress with exclude option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/excl-src"
          echo "Include me" > "$GITHUB_WORKSPACE/excl-src/include.txt"
          echo "Exclude me" > "$GITHUB_WORKSPACE/excl-src/exclude.log"
          echo "Also include" > "$GITHUB_WORKSPACE/excl-src/also-include.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: excl-src
          dest: excl-output
          destfilename: archive
          format: zip
          exclude: "*.log"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/excl-output/archive.zip" ]; then
            echo "FAIL: expected archive file not found at excl-output/archive.zip"
            ls -la "$GITHUB_WORKSPACE/excl-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set"

      - name: Assert excluded file is not in archive
        run: |
          CONTENTS=$(unzip -l "$GITHUB_WORKSPACE/excl-output/archive.zip")
          echo "Archive contents:"
          echo "$CONTENTS"
          if echo "$CONTENTS" | grep -q "exclude.log"; then
            echo "FAIL: excluded file 'exclude.log' found in archive"
            exit 1
          fi
          echo "PASS: excluded file is not in archive"

      - name: Assert included files are in archive
        run: |
          CONTENTS=$(unzip -l "$GITHUB_WORKSPACE/excl-output/archive.zip")
          if ! echo "$CONTENTS" | grep -q "include.txt"; then
            echo "FAIL: expected file 'include.txt' not found in archive"
            exit 1
          fi
          echo "PASS: included files are present in archive"
