name: Test compress with exclude option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files including one to exclude
        run: |
          mkdir -p "$GITHUB_WORKSPACE/excl-src"
          echo "keep this file" > "$GITHUB_WORKSPACE/excl-src/keep.txt"
          echo "also keep this" > "$GITHUB_WORKSPACE/excl-src/keep2.txt"
          echo "exclude this file" > "$GITHUB_WORKSPACE/excl-src/secret.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: excl-src
          dest: excl-output
          destfilename: filtered
          format: zip
          includeRoot: "false"
          exclude: "secret.txt"
          verbose: "true"

      - name: Log file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"

      - name: Assert filtered archive exists
        run: |
          echo "Listing excl-output:"
          ls -la "$GITHUB_WORKSPACE/excl-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/excl-output/filtered.zip" ]; then
            echo "FAIL: expected filtered.zip not found in excl-output"
            exit 1
          fi
          echo "PASS: filtered.zip exists"

      - name: Assert kept files are in archive and excluded file is not
        run: |
          unzip -l "$GITHUB_WORKSPACE/excl-output/filtered.zip"
          if ! unzip -l "$GITHUB_WORKSPACE/excl-output/filtered.zip" | grep -q "keep.txt"; then
            echo "FAIL: keep.txt not found in archive (should be included)"
            exit 1
          fi
          if unzip -l "$GITHUB_WORKSPACE/excl-output/filtered.zip" | grep -q "secret.txt"; then
            echo "FAIL: secret.txt found in archive (should be excluded)"
            exit 1
          fi
          echo "PASS: exclude option works correctly"
