name: Test decompress tgz format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create and tgz source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tgz-decomp-src"
          echo "Hello TGZ Decompress" > "$GITHUB_WORKSPACE/tgz-decomp-src/hello.txt"
          echo "Data content" > "$GITHUB_WORKSPACE/tgz-decomp-src/data.txt"
          mkdir -p "$GITHUB_WORKSPACE/tgz-decomp-archive"
          cd "$GITHUB_WORKSPACE" && tar -czf tgz-decomp-archive/test.tgz tgz-decomp-src/

      - id: decompress
        uses: .
        with:
          command: decompress
          source: tgz-decomp-archive/test.tgz
          dest: tgz-decomp-output
          format: tgz

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert decompressed files exist
        run: |
          echo "Contents of tgz-decomp-output:"
          find "$GITHUB_WORKSPACE/tgz-decomp-output" -type f 2>/dev/null || echo "No files found"
          FILE_COUNT=$(find "$GITHUB_WORKSPACE/tgz-decomp-output" -type f | wc -l)
          echo "File count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "FAIL: no files were decompressed"
            exit 1
          fi
          echo "PASS: files were decompressed successfully"

      - name: Assert hello.txt content is correct
        run: |
          HELLO_FILE=$(find "$GITHUB_WORKSPACE/tgz-decomp-output" -name "hello.txt" | head -1)
          if [ -z "$HELLO_FILE" ]; then
            echo "FAIL: hello.txt not found in decompressed output"
            find "$GITHUB_WORKSPACE/tgz-decomp-output" -type f
            exit 1
          fi
          CONTENT=$(cat "$HELLO_FILE")
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "Hello TGZ Decompress" ]; then
            echo "FAIL: expected 'Hello TGZ Decompress' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: hello.txt content is correct"
