name: Test tgz without root folder and with exclude
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files
        run: |
          rm -rf tgzdir tgzdir.tgz
          mkdir -p tgzdir/keep
          echo "keep me" > tgzdir/keep/a.txt
          echo "top" > tgzdir/top.txt
          echo "drop me" > tgzdir/debug.log
      - id: compress
        uses: .
        with:
          command: compress
          source: ./tgzdir
          format: tgz
          includeRoot: "false"
          exclude: "debug.log"
          compression_level: "9"
      - name: Assert archive contents
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ ! -f tgzdir.tgz ]; then echo "FAIL: tgzdir.tgz not found"; exit 1; fi
          LIST=$(tar -tzf tgzdir.tgz)
          echo "$LIST"
          if echo "$LIST" | grep -q 'debug.log'; then echo "FAIL: excluded file present"; exit 1; fi
          if echo "$LIST" | grep -q 'tgzdir/'; then echo "FAIL: root folder should not be included"; exit 1; fi
          echo "$LIST" | grep -qE '(^|\./)top.txt$' || { echo "FAIL: top.txt missing"; exit 1; }
          echo "$LIST" | grep -qE '(^|\./)keep/a.txt$' || { echo "FAIL: keep/a.txt missing"; exit 1; }
          echo "PASS"
