name: Test compress and decompress tgz round-trip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tgz-source/subdir"
          echo "Hello tgz" > "$GITHUB_WORKSPACE/tgz-source/hello.txt"
          echo "Data file" > "$GITHUB_WORKSPACE/tgz-source/data.txt"
          echo "Nested file" > "$GITHUB_WORKSPACE/tgz-source/subdir/nested.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: ${{ github.workspace }}/tgz-source
          dest: ${{ github.workspace }}/tgz-output
          destfilename: myarchive
          format: tgz
          verbose: "true"

      - name: Assert compress succeeded
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
          FILE_COUNT: ${{ steps.compress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: archive not found at $FILE_PATH"
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum is empty"
            exit 1
          fi
          echo "PASS: compress succeeded"

      - name: Decompress the archive
        id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: ${{ github.workspace }}/tgz-extracted
          format: tgz
          verbose: "true"

      - name: Assert decompress succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path is empty"
            exit 1
          fi
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: decompress file_count is empty"
            exit 1
          fi
          echo "PASS: decompress succeeded"

      - name: Assert extracted files exist
        run: |
          echo "Listing extracted directory:"
          find "$GITHUB_WORKSPACE/tgz-extracted" -type f | sort
          COUNT=$(find "$GITHUB_WORKSPACE/tgz-extracted" -name "hello.txt" | wc -l)
          echo "Found $COUNT hello.txt files"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: hello.txt not found in extracted output"
            exit 1
          fi
          echo "PASS: extracted files found"
