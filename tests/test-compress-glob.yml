name: Test compress with glob pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files with nested structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/glob-source/subdir1"
          mkdir -p "$GITHUB_WORKSPACE/glob-source/subdir2"
          echo "Doc file 1" > "$GITHUB_WORKSPACE/glob-source/subdir1/file1.txt"
          echo "Doc file 2" > "$GITHUB_WORKSPACE/glob-source/subdir2/file2.txt"
          echo "Root doc" > "$GITHUB_WORKSPACE/glob-source/root.txt"
          mkdir -p "$GITHUB_WORKSPACE/glob-output"

      - id: compress-glob-flat
        uses: .
        with:
          command: compress
          source: ./glob-source/**/*.txt
          dest: ./glob-output
          destfilename: glob-flat
          format: zip
          preserveGlobStructure: "false"
          verbose: "true"

      - name: Assert glob flat compress succeeded
        env:
          FILE_PATH: ${{ steps.compress-glob-flat.outputs.file_path }}
          FILE_COUNT: ${{ steps.compress-glob-flat.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/glob-output/glob-flat.zip" ]; then
            echo "FAIL: compressed file not found"
            echo "Contents of glob-output:"
            ls -la "$GITHUB_WORKSPACE/glob-output/" || true
            exit 1
          fi
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count output is empty"
            exit 1
          fi
          echo "PASS: glob flat compress succeeded with $FILE_COUNT files"

      - id: compress-glob-preserve
        uses: .
        with:
          command: compress
          source: ./glob-source/**/*.txt
          dest: ./glob-output
          destfilename: glob-preserve
          format: zip
          preserveGlobStructure: "true"
          verbose: "true"

      - name: Assert glob preserve-structure compress succeeded
        env:
          FILE_PATH: ${{ steps.compress-glob-preserve.outputs.file_path }}
          FILE_COUNT: ${{ steps.compress-glob-preserve.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/glob-output/glob-preserve.zip" ]; then
            echo "FAIL: compressed file not found"
            echo "Contents of glob-output:"
            ls -la "$GITHUB_WORKSPACE/glob-output/" || true
            exit 1
          fi
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count output is empty"
            exit 1
          fi
          echo "PASS: glob preserve-structure compress succeeded with $FILE_COUNT files"
