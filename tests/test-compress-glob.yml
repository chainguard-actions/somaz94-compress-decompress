name: Test compress with glob pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files with glob-matchable pattern
        run: |
          mkdir -p "$GITHUB_WORKSPACE/glob-src/docs"
          mkdir -p "$GITHUB_WORKSPACE/glob-src/notes"
          echo "document one" > "$GITHUB_WORKSPACE/glob-src/docs/doc1.txt"
          echo "document two" > "$GITHUB_WORKSPACE/glob-src/docs/doc2.txt"
          echo "note one" > "$GITHUB_WORKSPACE/glob-src/notes/note1.txt"
          echo "not a txt" > "$GITHUB_WORKSPACE/glob-src/readme.md"

      - id: compress
        uses: .
        with:
          command: compress
          source: "glob-src/**/*.txt"
          dest: glob-output
          destfilename: glob-archive
          format: zip
          preserveGlobStructure: "true"
          verbose: "true"

      - name: Log file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"

      - name: Assert glob archive exists
        run: |
          echo "Listing glob-output:"
          ls -la "$GITHUB_WORKSPACE/glob-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/glob-output/glob-archive.zip" ]; then
            echo "FAIL: expected glob-archive.zip not found in glob-output"
            exit 1
          fi
          echo "PASS: glob-archive.zip exists"

      - name: Assert glob archive contains txt files but not md
        run: |
          unzip -l "$GITHUB_WORKSPACE/glob-output/glob-archive.zip"
          if ! unzip -l "$GITHUB_WORKSPACE/glob-output/glob-archive.zip" | grep -q "doc1.txt"; then
            echo "FAIL: doc1.txt not found in archive"
            exit 1
          fi
          if ! unzip -l "$GITHUB_WORKSPACE/glob-output/glob-archive.zip" | grep -q "note1.txt"; then
            echo "FAIL: note1.txt not found in archive"
            exit 1
          fi
          echo "PASS: glob archive contains expected txt files"
