name: Test password-protected zip compress and decompress
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pwd-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/pwd-source/secret.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: ./pwd-source
          dest: ./pwd-output
          destfilename: protected
          format: zip
          password: "TestPassword123"

      - name: Assert file_path output is set
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is '$FILE_PATH'"

      - name: Assert checksum output is set
        env:
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "checksum: $CHECKSUM"
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum is set"

      - name: Assert archive file exists
        run: |
          ls -la "$GITHUB_WORKSPACE/pwd-output/" || true
          if [ ! -f "$GITHUB_WORKSPACE/pwd-output/protected.zip" ]; then
            echo "FAIL: archive file not found at pwd-output/protected.zip"
            exit 1
          fi
          echo "PASS: archive file exists"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ./pwd-output/protected.zip
          dest: ./pwd-decomp-output
          format: zip
          password: "TestPassword123"

      - name: Assert decompressed file_path output is set
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path output is empty"
            exit 1
          fi
          echo "PASS: decompress file_path is '$FILE_PATH'"

      - name: Assert decompressed files exist and content is correct
        run: |
          echo "Contents of decompress output:"
          find "$GITHUB_WORKSPACE/pwd-decomp-output" -type f | sort
          SECRET_FILE=$(find "$GITHUB_WORKSPACE/pwd-decomp-output" -name "secret.txt" | head -1)
          if [ -z "$SECRET_FILE" ]; then
            echo "FAIL: secret.txt not found in decompressed output"
            exit 1
          fi
          CONTENT=$(cat "$SECRET_FILE")
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "Secret content" ]; then
            echo "FAIL: content mismatch, got: '$CONTENT'"
            exit 1
          fi
          echo "PASS: password-protected zip round-trip succeeded"
