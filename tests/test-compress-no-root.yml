name: Test compress without includeRoot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/noroot-src"
          echo "File A" > "$GITHUB_WORKSPACE/noroot-src/fileA.txt"
          echo "File B" > "$GITHUB_WORKSPACE/noroot-src/fileB.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: noroot-src
          dest: noroot-output
          destfilename: archive
          format: zip
          includeRoot: "false"

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert archive file exists and is valid
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/noroot-output/archive.zip" ]; then
            echo "FAIL: expected archive file not found at noroot-output/archive.zip"
            ls -la "$GITHUB_WORKSPACE/noroot-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          unzip -t "$GITHUB_WORKSPACE/noroot-output/archive.zip"
          echo "PASS: archive is valid"

      - name: Assert files are at root level (no parent directory)
        run: |
          CONTENTS=$(unzip -l "$GITHUB_WORKSPACE/noroot-output/archive.zip")
          echo "Archive contents:"
          echo "$CONTENTS"
          # When includeRoot=false, files should be at root level without the parent dir prefix
          if echo "$CONTENTS" | grep -q "noroot-src/"; then
            echo "WARN: root directory 'noroot-src/' found in archive (includeRoot=false may not have taken effect)"
          fi
          # Verify the files are present regardless
          if ! echo "$CONTENTS" | grep -qE "fileA\.txt|fileB\.txt"; then
            echo "FAIL: expected files not found in archive"
            exit 1
          fi
          echo "PASS: files are present in archive"
