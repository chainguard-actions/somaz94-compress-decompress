name: Test password-protected zip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pwd-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/pwd-source/secret.txt"
          echo "More secrets" > "$GITHUB_WORKSPACE/pwd-source/more.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: pwd-source
          dest: pwd-output
          destfilename: protected
          format: zip
          password: "test-password-123"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/pwd-output/protected.zip" ]; then
            echo "FAIL: expected archive file not found at $GITHUB_WORKSPACE/pwd-output/protected.zip"
            ls -la "$GITHUB_WORKSPACE/pwd-output/" || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: password-protected archive file exists"

      - name: Assert archive is password protected (unzip without password should fail)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pwd-test-unprotected"
          if unzip -o "$GITHUB_WORKSPACE/pwd-output/protected.zip" -d "$GITHUB_WORKSPACE/pwd-test-unprotected" 2>/dev/null; then
            echo "WARN: archive may not be password protected (some zip tools skip encryption check)"
          else
            echo "PASS: archive requires password to extract"
          fi

      - id: decompress
        uses: .
        with:
          command: decompress
          source: pwd-output/protected.zip
          dest: pwd-decompressed
          format: zip
          password: "test-password-123"

      - name: Assert file_path output is set after decompression
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $FILE_PATH"

      - name: Assert decompressed files exist
        run: |
          echo "Contents of $GITHUB_WORKSPACE/pwd-decompressed:"
          find "$GITHUB_WORKSPACE/pwd-decompressed" -type f || echo "No files found"
          if ! find "$GITHUB_WORKSPACE/pwd-decompressed" -name "secret.txt" | grep -q .; then
            echo "FAIL: expected decompressed file secret.txt not found"
            exit 1
          fi
          echo "PASS: decompressed files exist"

      - name: Assert decompressed file content is correct
        run: |
          CONTENT=$(find "$GITHUB_WORKSPACE/pwd-decompressed" -name "secret.txt" -exec cat {} \;)
          echo "content: $CONTENT"
          if [ "$CONTENT" != "Secret content" ]; then
            echo "FAIL: expected 'Secret content' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: file content is correct"
