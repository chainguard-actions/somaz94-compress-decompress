name: Test password-protected zip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/password-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/password-source/secret.txt"
          echo "More secrets" > "$GITHUB_WORKSPACE/password-source/data.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: password-source
          dest: password-output
          destfilename: protected
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert password-protected archive created
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum is empty"
            exit 1
          fi
          echo "PASS: password-protected archive created at $FILE_PATH"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: password-extracted
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert password-protected archive extracted
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty after decompress"
            exit 1
          fi
          echo "PASS: decompress output is set"

      - name: Assert extracted files exist
        run: |
          echo "Contents of password-extracted:"
          find "$GITHUB_WORKSPACE/password-extracted" -type f | sort
          if find "$GITHUB_WORKSPACE/password-extracted" -name "secret.txt" | grep -q .; then
            echo "PASS: secret.txt found in extracted output"
          else
            echo "FAIL: secret.txt not found in extracted output"
            exit 1
          fi
