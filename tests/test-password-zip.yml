name: Test password-protected zip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pwd-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/pwd-source/secret.txt"
          echo "More secrets" > "$GITHUB_WORKSPACE/pwd-source/private.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: ${{ github.workspace }}/pwd-source
          dest: ${{ github.workspace }}/pwd-output
          destfilename: protected
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert compress with password succeeded
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: archive not found at $FILE_PATH"
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum is empty"
            exit 1
          fi
          echo "PASS: password-protected zip created"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: ${{ github.workspace }}/pwd-extracted
          format: zip
          password: "TestPassword123"
          verbose: "true"

      - name: Assert decompress with password succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path is empty"
            exit 1
          fi
          echo "PASS: password-protected zip decompressed"

      - name: Assert extracted files are readable
        run: |
          echo "Listing extracted files:"
          find "$GITHUB_WORKSPACE/pwd-extracted" -type f | sort
          COUNT=$(find "$GITHUB_WORKSPACE/pwd-extracted" -name "*.txt" | wc -l)
          echo "Found $COUNT txt files"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no txt files found in extracted output"
            exit 1
          fi
          echo "PASS: extracted files are readable"
