name: Test password-protected zip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/password-source"
          echo "Secret content" > "$GITHUB_WORKSPACE/password-source/secret.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: ./password-source
          dest: ./password-output
          destfilename: protected
          format: zip
          password: "TestPassword123"
          verbose: "true"
          step_summary: "false"

      - name: Assert compress with password succeeded
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/password-output/protected.zip" ]; then
            echo "FAIL: archive does not exist"
            ls -la "$GITHUB_WORKSPACE/password-output/" 2>/dev/null || echo "Output dir does not exist"
            exit 1
          fi
          echo "PASS: password-protected archive created"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ./password-output/protected.zip
          dest: ./password-extracted
          format: zip
          password: "TestPassword123"
          verbose: "true"
          step_summary: "false"

      - name: Assert decompress with correct password succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path is empty"
            exit 1
          fi
          echo "PASS: decompress with correct password succeeded"

      - name: Assert extracted file content
        run: |
          echo "Contents of password-extracted:"
          find "$GITHUB_WORKSPACE/password-extracted" -type f | sort
          COUNT=$(find "$GITHUB_WORKSPACE/password-extracted" -type f | wc -l)
          echo "Found $COUNT files"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no files extracted"
            exit 1
          fi
          echo "PASS: files extracted from password-protected archive"
