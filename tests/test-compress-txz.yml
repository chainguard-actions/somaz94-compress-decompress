name: Test compress txz format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p txz-source
          echo "XZ compressed content" > txz-source/data.txt
          echo "More data" > txz-source/more.txt

      - id: compress
        uses: .
        with:
          command: compress
          source: ./txz-source
          dest: ./txz-dest
          destfilename: archive
          format: txz
          verbose: "true"
          step_summary: "false"

      - name: Assert file_path output
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path=$FILE_PATH"

      - name: Assert archive file exists on host
        run: |
          ls -la txz-dest/ || true
          if [ ! -f "txz-dest/archive.txz" ]; then
            echo "FAIL: archive not found"
            exit 1
          fi
          echo "PASS: txz archive created"

      - name: Assert original_size output
        env:
          ORIGINAL_SIZE: ${{ steps.compress.outputs.original_size }}
        run: |
          echo "original_size: $ORIGINAL_SIZE"
          if [ -z "$ORIGINAL_SIZE" ]; then
            echo "FAIL: original_size output is empty"
            exit 1
          fi
          echo "PASS: original_size=$ORIGINAL_SIZE"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: ./txz-extract
          format: txz
          verbose: "true"
          step_summary: "false"

      - name: Assert decompress succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: decompress file_path output is empty"
            exit 1
          fi
          echo "PASS: txz decompression succeeded"

      - name: Assert extracted files exist
        run: |
          echo "Contents of extract dir:"
          find txz-extract -type f | sort
          if ! find txz-extract -name "data.txt" | grep -q .; then
            echo "FAIL: data.txt not found in extracted output"
            exit 1
          fi
          CONTENT=$(find txz-extract -name "data.txt" -exec cat {} \;)
          echo "Content: $CONTENT"
          if [ "$CONTENT" != "XZ compressed content" ]; then
            echo "FAIL: file content mismatch"
            exit 1
          fi
          echo "PASS: txz round-trip verified"
