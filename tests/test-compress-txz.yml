name: Test compress txz format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files to compress
        run: |
          mkdir -p "$GITHUB_WORKSPACE/txz-src"
          echo "Hello TXZ" > "$GITHUB_WORKSPACE/txz-src/hello.txt"
          echo "More data" > "$GITHUB_WORKSPACE/txz-src/more.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: txz-src
          dest: txz-output
          destfilename: archive
          format: txz

      - name: Assert file_path output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.file_path }}
        run: |
          echo "actual file_path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: file_path output is empty"
            exit 1
          fi
          echo "PASS: file_path is set to $ACTUAL"

      - name: Assert checksum output is set
        env:
          ACTUAL: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "actual checksum: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: checksum output is empty"
            exit 1
          fi
          echo "PASS: checksum is set"

      - name: Assert archive file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/txz-output/archive.txz" ]; then
            echo "FAIL: expected archive file not found at txz-output/archive.txz"
            ls -la "$GITHUB_WORKSPACE/txz-output/" 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: archive file exists"

      - name: Assert archive is valid txz
        run: |
          tar -tJf "$GITHUB_WORKSPACE/txz-output/archive.txz"
          echo "PASS: archive is a valid txz file"
