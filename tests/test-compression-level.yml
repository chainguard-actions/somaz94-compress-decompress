name: Test compression level and ratio outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files with compressible content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/level-source"
          # Create files with repetitive content that compresses well
          python3 -c "print('A' * 10000)" > "$GITHUB_WORKSPACE/level-source/compressible.txt"
          python3 -c "print('B' * 10000)" > "$GITHUB_WORKSPACE/level-source/compressible2.txt"

      - id: compress-max
        uses: .
        with:
          command: compress
          source: level-source
          dest: level-output
          destfilename: max-compressed
          format: tgz
          compression_level: "9"
          verbose: "true"

      - name: Assert max compression outputs
        env:
          FILE_PATH: ${{ steps.compress-max.outputs.file_path }}
          CHECKSUM: ${{ steps.compress-max.outputs.checksum }}
          ORIGINAL_SIZE: ${{ steps.compress-max.outputs.original_size }}
          COMPRESSED_SIZE: ${{ steps.compress-max.outputs.compressed_size }}
          COMPRESSION_RATIO: ${{ steps.compress-max.outputs.compression_ratio }}
          FILE_COUNT: ${{ steps.compress-max.outputs.file_count }}
          DURATION: ${{ steps.compress-max.outputs.duration }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          echo "original_size: $ORIGINAL_SIZE"
          echo "compressed_size: $COMPRESSED_SIZE"
          echo "compression_ratio: $COMPRESSION_RATIO"
          echo "file_count: $FILE_COUNT"
          echo "duration: $DURATION"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum is empty"
            exit 1
          fi
          if [ -z "$ORIGINAL_SIZE" ]; then
            echo "FAIL: original_size is empty"
            exit 1
          fi
          if [ -z "$COMPRESSED_SIZE" ]; then
            echo "FAIL: compressed_size is empty"
            exit 1
          fi
          if [ -z "$COMPRESSION_RATIO" ]; then
            echo "FAIL: compression_ratio is empty"
            exit 1
          fi
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count is empty"
            exit 1
          fi
          if [ -z "$DURATION" ]; then
            echo "FAIL: duration is empty"
            exit 1
          fi
          echo "PASS: all outputs are set for max compression"

      - id: compress-store
        uses: .
        with:
          command: compress
          source: level-source
          dest: level-output
          destfilename: store-only
          format: zip
          compression_level: "0"
          verbose: "true"

      - name: Assert store-only compression outputs
        env:
          FILE_PATH: ${{ steps.compress-store.outputs.file_path }}
          COMPRESSION_RATIO: ${{ steps.compress-store.outputs.compression_ratio }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "compression_ratio: $COMPRESSION_RATIO"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty for store-only"
            exit 1
          fi
          echo "PASS: store-only archive created"
