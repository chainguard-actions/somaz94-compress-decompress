name: Test compression level option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/level-source"
          # Create a larger file to make compression level differences visible
          python3 -c "print('A' * 10000)" > "$GITHUB_WORKSPACE/level-source/large.txt"
          echo "small file" > "$GITHUB_WORKSPACE/level-source/small.txt"

      - id: compress-max
        uses: .
        with:
          command: compress
          source: ./level-source
          dest: ./level-output
          destfilename: archive-max
          format: tgz
          compression_level: "9"
          verbose: "true"
          step_summary: "false"

      - name: Assert max compression succeeded
        env:
          FILE_PATH: ${{ steps.compress-max.outputs.file_path }}
          COMPRESSED_SIZE: ${{ steps.compress-max.outputs.compressed_size }}
          COMPRESSION_RATIO: ${{ steps.compress-max.outputs.compression_ratio }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "compressed_size: $COMPRESSED_SIZE"
          echo "compression_ratio: $COMPRESSION_RATIO"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/level-output/archive-max.tgz" ]; then
            echo "FAIL: archive does not exist"
            ls -la "$GITHUB_WORKSPACE/level-output/" 2>/dev/null || echo "Output dir does not exist"
            exit 1
          fi
          if [ -z "$COMPRESSED_SIZE" ]; then
            echo "FAIL: compressed_size is empty"
            exit 1
          fi
          echo "PASS: max compression succeeded, size=$COMPRESSED_SIZE, ratio=$COMPRESSION_RATIO"

      - id: compress-store
        uses: .
        with:
          command: compress
          source: ./level-source
          dest: ./level-output
          destfilename: archive-store
          format: zip
          compression_level: "0"
          verbose: "true"
          step_summary: "false"

      - name: Assert store-only compression succeeded
        env:
          FILE_PATH: ${{ steps.compress-store.outputs.file_path }}
        run: |
          echo "file_path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/level-output/archive-store.zip" ]; then
            echo "FAIL: archive does not exist"
            ls -la "$GITHUB_WORKSPACE/level-output/" 2>/dev/null || echo "Output dir does not exist"
            exit 1
          fi
          echo "PASS: store-only compression succeeded"
