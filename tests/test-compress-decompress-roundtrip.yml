name: Test compress and decompress round-trip (tgz)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/roundtrip-source"
          echo "Round trip test content" > "$GITHUB_WORKSPACE/roundtrip-source/test.txt"
          echo "Second file content" > "$GITHUB_WORKSPACE/roundtrip-source/second.txt"
          mkdir -p "$GITHUB_WORKSPACE/roundtrip-source/subdir"
          echo "Nested file" > "$GITHUB_WORKSPACE/roundtrip-source/subdir/nested.txt"

      - id: compress
        uses: .
        with:
          command: compress
          source: roundtrip-source
          dest: roundtrip-output
          destfilename: roundtrip
          format: tgz
          verbose: "true"

      - name: Assert compress succeeded
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "checksum: $CHECKSUM"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty after compress"
            exit 1
          fi
          if [ -z "$CHECKSUM" ]; then
            echo "FAIL: checksum is empty after compress"
            exit 1
          fi
          echo "PASS: compress succeeded"

      - id: decompress
        uses: .
        with:
          command: decompress
          source: ${{ steps.compress.outputs.file_path }}
          dest: roundtrip-extracted
          format: tgz
          verbose: "true"

      - name: Assert decompress succeeded
        env:
          FILE_PATH: ${{ steps.decompress.outputs.file_path }}
          FILE_COUNT: ${{ steps.decompress.outputs.file_count }}
        run: |
          echo "file_path: $FILE_PATH"
          echo "file_count: $FILE_COUNT"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file_path is empty after decompress"
            exit 1
          fi
          if [ -z "$FILE_COUNT" ]; then
            echo "FAIL: file_count is empty after decompress"
            exit 1
          fi
          echo "PASS: decompress outputs are set"

      - name: Assert extracted files exist
        run: |
          echo "Contents of roundtrip-extracted:"
          find "$GITHUB_WORKSPACE/roundtrip-extracted" -type f | sort
          if find "$GITHUB_WORKSPACE/roundtrip-extracted" -name "test.txt" | grep -q .; then
            echo "PASS: test.txt found in extracted output"
          else
            echo "FAIL: test.txt not found in extracted output"
            exit 1
          fi
