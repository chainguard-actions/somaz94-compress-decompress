name: Test compress fail_on_error false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure source does not exist
        run: |
          rm -rf nonexistent-source

      - id: compress
        uses: .
        continue-on-error: true
        with:
          command: compress
          source: ./nonexistent-source
          dest: ./failtest-dest
          destfilename: should-fail
          format: zip
          fail_on_error: "false"
          verbose: "true"
          step_summary: "false"

      - name: Assert action did not fail the step (fail_on_error=false)
        env:
          OUTCOME: ${{ steps.compress.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_on_error=false, the step should succeed even if compression fails
          # The action may succeed (empty source) or fail gracefully
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome=$OUTCOME (fail_on_error=false handled)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
